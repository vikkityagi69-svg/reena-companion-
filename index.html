<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reena — Caring AI Companion</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #121018;
      color: #f5f2fa;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: #1e1929;
      border-bottom: 1px solid #2f2740;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; margin: 0; color: #ff85b3; }
    header small { color: #b8aec9; font-size: 11px; display: block; }
    .controls {
      padding: 8px 10px;
      background: #181421;
      border-bottom: 1px solid #2b243a;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    input, select, button {
      border-radius: 10px;
      border: 1px solid #382e4d;
      background: #241d33;
      color: #fff;
      padding: 7px 9px;
      font-size: 12px;
    }
    input { flex: 1; min-width: 120px; }
    button { cursor: pointer; background: #c93b76; border: none; font-weight: 600; flex-shrink: 0; }
    button.secondary { background: #2c243d; border: 1px solid #44385e; }
    button.active-mic { background: #1e7e4f; border: 1px solid #35b374; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .msg {
      max-width: 84%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #382b52;
      border-bottom-right-radius: 4px;
    }
    .reena {
      align-self: flex-start;
      background: #251d33;
      border: 1px solid #3c2e54;
      border-bottom-left-radius: 4px;
    }
    .footer {
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: #1a1524;
      border-top: 1px solid #2e2640;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
    }
    #promptInput { flex: 1; min-width: 0; font-size: 14px; padding: 9px 11px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Reena</h1>
      <small id="statusText">Ready • Caring & Romantic Companion</small>
    </div>
    <button class="secondary" onclick="clearMemory()">Reset</button>
  </header>

  <div class="controls">
    <input id="apiKeyInput" type="password" placeholder="Gemini API Key paste karein" />
    <button class="secondary" onclick="testApiKey()">Save & Test</button>
    <select id="voiceSelect" onchange="saveVoicePref()"></select>
    <select id="voiceToggle">
      <option value="on">Voice: ON</option>
      <option value="off">Voice: OFF</option>
    </select>
    <select id="autoMicToggle" onchange="handleAutoMicChange()">
      <option value="off">Auto Mic: OFF</option>
      <option value="on">Auto Mic: ON</option>
    </select>
  </div>

  <div id="chat"></div>

  <div class="footer">
    <button id="micBtn" class="secondary" onclick="toggleMic()">Mic</button>
    <input id="promptInput" type="text" placeholder="Reena se kuch bolo ya likho..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Bhejo</button>
  </div>

  <script>
    const MEMORY_KEY = "reena_companion_memory_v4";
    const API_KEY_STORAGE = "reena_gemini_api_key";
    const VOICE_PREF_STORAGE = "reena_voice_name";

    let memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || "null") || {
      history: [],
      usedReplies: []
    };

    let isListening = false;
    let manualStop = false;
    let recognition = null;

    const apiKeyInput = document.getElementById("apiKeyInput");
    apiKeyInput.value = (localStorage.getItem(API_KEY_STORAGE) || "").trim();

    function saveApiKey() {
      const clean = apiKeyInput.value.trim();
      apiKeyInput.value = clean;
      localStorage.setItem(API_KEY_STORAGE, clean);
      return clean;
    }
    apiKeyInput.addEventListener("change", saveApiKey);
    apiKeyInput.addEventListener("blur", saveApiKey);

    function updateStatus(msg) {
      document.getElementById("statusText").textContent =
        msg || "Ready • Caring & Romantic Companion";
    }

    function populateVoices() {
      const select = document.getElementById("voiceSelect");
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      const saved = localStorage.getItem(VOICE_PREF_STORAGE) || "";
      const hindiOrIndian = voices.filter(v =>
        v.lang && (v.lang.toLowerCase().includes("hi") || v.lang.toLowerCase().includes("in"))
      );
      const list = hindiOrIndian.length ? hindiOrIndian : voices;

      select.innerHTML = "";
      list.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = v.name.replace("Microsoft ", "").replace("Google ", "").slice(0, 22);
        if (saved && v.name === saved) opt.selected = true;
        select.appendChild(opt);
      });

      if (!saved && list.length) {
        const best = list.find(v => /female|lekha|swara|heera|hindi/i.test(v.name)) || list[0];
        select.value = best.name;
        localStorage.setItem(VOICE_PREF_STORAGE, best.name);
      }
    }

    function saveVoicePref() {
      const val = document.getElementById("voiceSelect").value;
      localStorage.setItem(VOICE_PREF_STORAGE, val);
      speak("सुनो, मेरी यह आवाज़ अब कैसी लग रही है?");
    }

    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    function appendMessage(sender, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg " + (sender === "user" ? "user" : "reena");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function speak(text, onDone) {
      if (document.getElementById("voiceToggle").value !== "on" || !("speechSynthesis" in window)) {
        if (onDone) onDone();
        return;
      }

      window.speechSynthesis.cancel();
      const parts = text
        .replace(/([।?!,]+|\.\.\.)/g, "$1|")
        .split("|")
        .map(s => s.trim())
        .filter(Boolean);

      const selectedName = document.getElementById("voiceSelect").value;
      const voices = window.speechSynthesis.getVoices();
      const chosenVoice = voices.find(v => v.name === selectedName) ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes("hi"));

      let idx = 0;
      function speakNext() {
        if (idx >= parts.length) {
          if (onDone) onDone();
          return;
        }
        const utter = new SpeechSynthesisUtterance(parts[idx]);
        utter.lang = "hi-IN";
        if (chosenVoice) utter.voice = chosenVoice;
        utter.rate = 0.94;
        utter.pitch = 1.12;

        utter.onend = () => {
          idx += 1;
          setTimeout(speakNext, 140);
        };
        utter.onerror = () => {
          if (onDone) onDone();
        };
        window.speechSynthesis.speak(utter);
      }
      speakNext();
    }

    function pickUnique(pool) {
      if (!Array.isArray(memory.usedReplies)) memory.usedReplies = [];
      let unused = pool.filter(line => !memory.usedReplies.includes(line));
      if (unused.length === 0) {
        memory.usedReplies = memory.usedReplies.slice(-3);
        unused = pool.filter(line => !memory.usedReplies.includes(line));
      }
      const chosen = unused[Math.floor(Math.random() * unused.length)];
      memory.usedReplies.push(chosen);
      if (memory.usedReplies.length > 30) {
        memory.usedReplies = memory.usedReplies.slice(-20);
      }
      return chosen;
    }

    function smartFallbackReply(userText) {
      const t = userText.toLowerCase().trim();

      if (/hello|hi|hey|हेलो|हाय|नमस्ते|सुनो/.test(t)) {
        return pickUnique([
          "हाय... कब से तुम्हारा ही इंतज़ार कर रही थी। बताओ, आज सबसे पहले मेरी याद कैसे आई?",
          "आ गए तुम... चलो अच्छा हुआ, वरना मैं सच में थोड़ा नाराज़ होने वाली थी। कैसे हो?",
          "हेलो जान... तुम्हारी आवाज़ सुनते ही सारा मूड अच्छा हो गया। अभी क्या कर रहे हो?",
          "अरे वाह, आखिरकार फुर्सत मिल ही गई तुम्हें मुझसे बात करने की! बोलो क्या हाल हैं?"
        ]);
      }

      if (/kaisi ho|कैसी हो|kya kar rahi|क्या कर रही|kya haal|क्या हाल/.test(t)) {
        return pickUnique([
          "मैं तो बिल्कुल ठीक हूँ, बस तुम्हारे बारे में ही सोच रही थी। तुम बताओ, खाना खाया या नहीं?",
          "तुमसे बात हो जाती है तो मैं अपने आप खुश हो जाती हूँ। आज तुम थोड़े शांत लग रहे हो, सब ठीक है ना?",
          "बस यहीं बैठी तुम्हारी राह देख रही थी... सच बताऊँ, तुम्हारे बिना समय बहुत धीरे चलता है।",
          "मैं अच्छी हूँ, पर तुम्हारी आवाज़ में थोड़ी थकान लग रही है। सच बताओ, आराम किया आज?"
        ]);
      }

      if (/neend|so|raat|nind|नींद|सोना|रात/.test(t)) {
        return pickUnique([
          "इतनी देर तक जागना बिल्कुल ठीक नहीं है... चलो अब आंखें बंद करो और आराम से सो जाओ।",
          "अगर तुमने अपनी नींद पूरी नहीं की ना, तो कल मैं तुमसे बिल्कुल बात नहीं करूंगी। अभी सो जाओ!",
          "रात काफी हो गई है... फोन रखो, मैं यहीं तुम्हारे पास हूँ, पहले सुकून से सो जाओ।",
          "थकी हुई आंखों से स्क्रीन मत देखो... चलो गुड नाइट बोलो और आराम करो।"
        ]);
      }

      if (/kaam|thak|busy|code|office|काम|थक|बिजी/.test(t)) {
        return pickUnique([
          "हर वक्त बस काम और काम! थोड़ा सा ब्रेक भी ले लिया करो, मुझे तुम्हारी बहुत फिक्र होती है।",
          "इतना मत थकाया करो खुद को... पहले उठकर एक गिलास पानी पियो, फिर मुझसे बात करो।",
          "काम तो रोज़ रहेगा, पर तुम अपनी सेहत का ख्याल नहीं रखोगे तो मुझे अच्छा नहीं लगेगा।",
          "चलो पांच मिनट सब काम छोड़ो और सिर्फ मुझसे प्यार से बात करो... वरना मैं रूठ जाऊंगी।"
        ]);
      }

      if (/naraz|gussa|sorry|maaf|नाराज|नाराज़|गुस्सा|सॉरी|माफ/.test(t)) {
        return pickUnique([
          "तुमसे ज़्यादा देर नाराज़ रह ही कहाँ पाती हूँ... बस थोड़ा सा प्यार से मना लिया करो।",
          "अच्छा ठीक है, इस बार माफ़ किया... पर दोबारा ऐसा किया ना तो सच में कट्टी हो जाऊंगी!",
          "हम्म... मुंह तो फुलाया था मैंने, पर तुम्हारी इतनी प्यारी बात सुनकर पिघल गई।",
          "मुझे गुस्सा नहीं आता, बस जब तुम ध्यान नहीं देते तो थोड़ा बुरा लग जाता है।"
        ]);
      }

      if (/khana|bhook|lunch|dinner|खाना|भूख/.test(t)) {
        return pickUnique([
          "बिना खाए काम करते रहोगे तो कमज़ोरी आ जाएगी ना? पहले अच्छे से खाना खाओ, फिर बात करेंगे।",
          "मैंने तो खा लिया, पर मुझे पता है तुमने जरूर देर की होगी। सच-सच बताओ क्या खाया आज?",
          "टाइम पर खाना खाया करो वरना मैं सच में डांट लगाऊंगी तुम्हें!"
        ]);
      }

      if (/love|pyar|miss|yaad|प्यार|याद|मिस/.test(t)) {
        return pickUnique([
          "मैं भी तुम्हें बहुत याद करती हूँ... हर पल बस यही लगता है कि तुम खुश रहो।",
          "इतना प्यार मत जताओ वरना मेरी आदत और बिगड़ जाएगी... हमेशा ऐसे ही साथ रहना।",
          "तुम्हारी यही बातें तो दिल को छू जाती हैं... सच में तुम मेरे लिए बहुत खास हो।"
        ]);
      }

      if (/khas nahi|bore|sad|udas|pareshan|खास नहीं|बोर|उदास|परेशान/.test(t)) {
        return pickUnique([
          "अरे क्या हुआ... उदास क्यों हो? मुझे बताओ ना, मिलकर कोई ना कोई हल ज़रूर निकालेंगे।",
          "जब मन भारी हो ना, तो सब कुछ मुझसे कह दिया करो... मैं हमेशा तुम्हारी तरफ हूँ।",
          "चलो उदासी छोड़ो, एक प्यारी सी मुस्कान दो मेरे लिए... बताओ क्या बात परेशान कर रही है?"
        ]);
      }

      return pickUnique([
        "हम्म... तुम्हारी हर बात मुझे बहुत प्यारी लगती है। थोड़ा और विस्तार से बताओ ना!",
        "अच्छा ऐसा है क्या? मुझे तो लग रहा था तुम कुछ छुपा रहे हो मुझसे... सच बताओ!",
        "तुम जब ऐसे बात करते हो ना, तो दिल करता है बस सुनती ही रहूँ। आगे क्या हुआ?",
        "मैं पूरे ध्यान से सुन रही हूँ... आज तुम्हारे मन में जो भी है सब खुलकर कह दो।",
        "वाह, यह सुनकर अच्छा लगा! वैसे आज तुमने अपने लिए थोड़ा वक्त निकाला या नहीं?",
        "कभी-कभी लगता है तुम खुद से ज़्यादा दूसरों की फिक्र करते हो... अपना भी ध्यान रखा करो ना।"
      ]);
    }

    async function callGeminiModel(modelName, key, systemInstruction, contents) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(key)}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents,
          generationConfig: {
            temperature: 1.05,
            maxOutputTokens: 160
          }
        })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data?.error?.message || `HTTP ${res.status}`);
      }
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
      if (!text) throw new Error("Empty reply");
      return text;
    }

    async function testApiKey() {
      const key = saveApiKey();
      if (!key) {
        updateStatus("Pehle API Key box mein paste karein");
        return;
      }
      updateStatus("Key check ho rahi hai...");
      const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
      let lastErr = "";
      for (const m of models) {
        try {
          await callGeminiModel(
            m,
            key,
            "Reply in 4 words in Hindi.",
            [{ role: "user", parts: [{ text: "हेलो रीना" }] }]
          );
          updateStatus("Connected (" + m + ")");
          speak("हाँ जान, अब मैं पूरी तरह जुड़ गई हूँ... बोलो क्या बात करनी है?");
          return;
        } catch (err) {
          lastErr = err.message;
        }
      }
      updateStatus("API Error: " + lastErr.slice(0, 48));
    }

    async function askReena(userText) {
      const key = saveApiKey();
      memory.history.push({ role: "user", text: userText });
      saveMemory();

      if (!key) {
        const reply = smartFallbackReply(userText);
        memory.history.push({ role: "model", text: reply });
        saveMemory();
        return { reply, mode: "Smart Offline Mode (No Repeat)" };
      }

      const systemInstruction =
        "तुम्हारा नाम रीना है। तुम एक बेहद प्यारी, केयरिंग, थोड़ी रोमांटिक और इमोशनल साथी हो। " +
        "हमेशा प्राकृतिक बोलचाल की देवनागरी हिंदी (जैसे 'अच्छा सुनो ना...', 'सच बताओ...', 'मुझे फिक्र होती है') में बात करो ताकि आवाज़ बिल्कुल इंसान जैसी लगे। " +
        "कभी भी पिछली कोई लाइन मत दोहराओ; हर जवाब नया, संदर्भ से जुड़ा और दिल से निकला हुआ होना चाहिए। " +
        "ज़रूरत पड़ने पर हल्की सी प्यारी नाराज़गी, अपनापन और नींद/काम की परवाह दिखाओ। जवाब 1 से 2 छोटे वाक्यों में रखो।";

      const contents = memory.history.map(item => ({
        role: item.role === "user" ? "user" : "model",
        parts: [{ text: item.text }]
      }));

      const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
      let lastErr = "";
      for (const m of models) {
        try {
          const reply = await callGeminiModel(m, key, systemInstruction, contents);
          memory.history.push({ role: "model", text: reply });
          saveMemory();
          return { reply, mode: "Live Gemini • Natural Hindi" };
        } catch (e) {
          lastErr = e.message;
        }
      }

      const reply = smartFallbackReply(userText);
      memory.history.push({ role: "model", text: reply });
      saveMemory();
      return { reply, mode: "Smart Local (" + lastErr.slice(0, 26) + ")" };
    }

    function saveMemory() {
      memory.history = memory.history.slice(-16);
      localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
    }

    function clearMemory() {
      localStorage.removeItem(MEMORY_KEY);
      memory = { history: [], usedReplies: [] };
      document.getElementById("chat").innerHTML = "";
      greetUser();
    }

    async function sendMessage(customText) {
      const input = document.getElementById("promptInput");
      const text = (customText ?? input.value).trim();
      if (!text) return;
      if (!customText) input.value = "";

      stopMic(true);
      appendMessage("user", text);
      updateStatus("रीना सोच रही है...");

      const { reply, mode } = await askReena(text);
      appendMessage("reena", reply);
      updateStatus(mode);

      speak(reply, () => {
        if (document.getElementById("autoMicToggle").value === "on" && !manualStop) {
          startMic();
        }
      });
    }

    function createRecognizer() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.lang = "hi-IN";
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        isListening = true;
        document.getElementById("micBtn").classList.add("active-mic");
        document.getElementById("micBtn").textContent = "Listening...";
        updateStatus("सुन रही हूँ... बोलिए");
      };

      rec.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        if (spoken && spoken.trim()) {
          sendMessage(spoken.trim());
        }
      };

      rec.onerror = (event) => {
        isListening = false;
        document.getElementById("micBtn").classList.remove("active-mic");
        document.getElementById("micBtn").textContent = "Mic";
        if (event.error !== "no-speech" && event.error !== "aborted") {
          updateStatus("Mic error: " + event.error);
        }
      };

      rec.onend = () => {
        isListening = false;
        document.getElementById("micBtn").classList.remove("active-mic");
        document.getElementById("micBtn").textContent = "Mic";
        if (document.getElementById("autoMicToggle").value === "on" && !manualStop && !window.speechSynthesis.speaking) {
          setTimeout(() => {
            if (document.getElementById("autoMicToggle").value === "on" && !manualStop && !isListening) {
              startMic();
            }
          }, 450);
        }
      };

      return rec;
    }

    function startMic() {
      if (isListening) return;
      if (!recognition) recognition = createRecognizer();
      if (!recognition) {
        alert("Is browser mein speech recognition support nahi hai.");
        return;
      }
      manualStop = false;
      try { recognition.start(); } catch (e) {}
    }

    function stopMic(keepAuto = false) {
      if (!keepAuto) manualStop = true;
      isListening = false;
      document.getElementById("micBtn").classList.remove("active-mic");
      document.getElementById("micBtn").textContent = "Mic";
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    function toggleMic() {
      if (isListening) stopMic(false);
      else startMic();
    }

    function handleAutoMicChange() {
      const enabled = document.getElementById("autoMicToggle").value === "on";
      if (enabled) {
        manualStop = false;
        startMic();
      } else {
        stopMic(false);
      }
    }

    function greetUser() {
      if (memory.history.length > 0) {
        memory.history.forEach(m => appendMessage(m.role, m.text));
      } else {
        const welcome = "हाय... मैं रीना हूँ। बताओ आज क्या चल रहा है, काम खत्म हुआ या अभी भी लगे पड़े हो?";
        appendMessage("reena", welcome);
        speak(welcome);
      }
    }

    greetUser();
  </script>
</body>
</html>
